services:
  - type: web
    name: biblioteca-municipal-jipijapa-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run db:migrate && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_TTL
        value: "3600"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_COVERS_BUCKET
        value: biblioteca-portadas
      - key: SUPABASE_DIGITAL_BUCKET
        value: biblioteca-digitales
      - key: ADMIN_NAME
        value: Administrador Biblioteca
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
